name: Deploy Frontend to VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'easytofindedu-web/**'
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'easytofindedu-web/package-lock.json'

      - name: Create environment file
        run: |
          cd easytofindedu-web
          echo "VITE_API_BASE_URL=https://easytofindedu.onrender.com/api/v1" > .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env

      - name: Install dependencies
        run: |
          cd easytofindedu-web
          npm ci

      - name: Build application
        run: |
          cd easytofindedu-web
          npm run build

      - name: Deploy to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "easytofindedu-web/dist/*"
          target: "/var/www/easytofindedu-temp"
          strip_components: 2

      - name: Move files to final location
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            rm -rf /var/www/easytofindedu/*
            mv /var/www/easytofindedu-temp/* /var/www/easytofindedu/
            rmdir /var/www/easytofindedu-temp
            echo "✅ Frontend deployed successfully"
